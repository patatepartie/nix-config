name: Unit tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - run: nix --extra-experimental-features "nix-command flakes" build --no-link -L .#checks.x86_64-linux.unknown-warnings
